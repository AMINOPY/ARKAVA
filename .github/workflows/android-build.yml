name: Android build

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Build native engine and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out ARKAVA
        uses: actions/checkout@v4

      - name: Check out pinned official libXray source
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: dbe95129fa96689c4643ddca52c278448eec6df1
          path: third_party/libXray-src
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, build tools and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build pinned libXray AAR
        working-directory: third_party/libXray-src
        run: |
          go version
          python3 build/main.py android
          test -s libXray.aar

      - name: Add native engine to app dependency set
        run: |
          mkdir -p app/libs
          cp third_party/libXray-src/libXray.aar app/libs/libXray.aar

      - name: Run unit tests and assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arkava-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native libXray AAR
        uses: actions/upload-artifact@v4
        with:
          name: libxray-android-dbe95129
          path: third_party/libXray-src/libXray.aar
          if-no-files-found: error
          retention-days: 14
